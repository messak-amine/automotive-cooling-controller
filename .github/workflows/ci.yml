
name: C Build and Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Compile simulation
        run: gcc -std=c11 -Wall -Wextra -Werror -Iinclude src/main.c src/cooling_controller.c -o cooling_sim

      - name: Compile unit tests
        run: gcc -std=c11 -Wall -Wextra -Werror -Iinclude tests/test_cooling_controller.c src/cooling_controller.c -o cooling_tests

      - name: Run unit tests
        run: ./cooling_tests
